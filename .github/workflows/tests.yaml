name: tests

# On every pull request, and on a push to develop or main (release.yml waits for the run of the
# push of a develop commit). A newer push to a pull request cancels its run still going; a run
# of a push to develop or main is never cancelled.
on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The release pull request (main-X.Y.Z into main) and the push of its merge to main hold
  # exactly the files of a develop commit (tested-on-develop.sh compares the trees). When that
  # commit's push run is green the suites do not run again, and the jobs below are green under
  # their own names (test (3.11), test (3.14), database) without them. Other files, or no green
  # run on develop, and everything runs.
  reuse:
    if: (github.event_name == 'pull_request' && startsWith(github.head_ref, 'main-')) || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      tested: ${{ steps.check.outputs.tested }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if .github/scripts/tested-on-develop.sh tests.yaml; then
            echo "tested=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: reuse
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    env:
      RUN: ${{ needs.reuse.outputs.tested != 'true' }}

    steps:
      - name: Tested on develop
        if: env.RUN != 'true'
        run: echo "the same files passed on develop"

      - uses: actions/checkout@v4
        if: env.RUN == 'true'

      - uses: actions/setup-python@v5
        if: env.RUN == 'true'
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v6
        if: env.RUN == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install dependencies
        if: env.RUN == 'true'
        run: uv pip install --system -e ".[dev]"

      - name: Check types
        if: env.RUN == 'true'
        run: mypy

      - name: Run tests
        if: env.RUN == 'true'
        run: pytest

  # The tests that need a database (tests/pg, tests/integration), against a PostgreSQL like
  # postgres-test of docker-compose.test.yml. The suites run in six shards side by side, made of
  # files by the first letter of their name (every letter in one shard) so that the measured
  # durations (--durations) of each add up to about the same, a sixth of the whole. Each is
  # spread test by test over the cores of its runner (worksteal): every test makes a database
  # of its own, so the tests do not meet, and a long file does not keep one core busy while the
  # others wait. The shard with tests/pg/test_query_plans.py runs loadgroup instead: worksteal
  # ignores the xdist_group that keeps its tests on the one worker that seeded their graph.
  database-shard:
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.tested != 'true' }}
    name: database-shard (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            tests: tests/pg/test_[a-ej-n]*.py
          - shard: 2
            tests: tests/pg/test_[f-i]*.py tests/integration/test_[k-mp-q]*.py
          - shard: 3
            tests: tests/pg/test_[s-z]*.py tests/integration/test_[norv-z]*.py
          - shard: 4
            tests: tests/integration/test_[a-ct]*.py
          - shard: 5
            tests: tests/integration/test_[d-i]*.py
          - shard: 6
            tests: tests/pg/test_[o-r]*.py tests/integration/test_[jsu]*.py
            dist: loadgroup

    env:
      ALLOW_DB_TESTS: '1'
      LAWGRAPH_TEST_DB_URL: postgresql://lawgraph:lawgraph-test@localhost:5433/lawgraph

    steps:
      - uses: actions/checkout@v4

      # Test data only: the data directory in memory, and no waiting for the disk (fsync,
      # synchronous_commit and full_page_writes off). JIT off, as on postgres-test. The
      # official image from the ECR Public mirror of Docker Hub (the same digest): a runner
      # pulling from Docker Hub without login hits its rate limit. ECR Public throttles a
      # burst of pulls too (the shards at once: "toomanyrequests"), so the pull is tried 5
      # times, 10, 20, 30 and 40 s apart. It starts while Python is installed; the step before
      # the tests waits until it answers.
      - name: Start PostgreSQL
        env:
          IMAGE: public.ecr.aws/docker/library/postgres:18
        run: |
          for i in 1 2 3 4 5; do
            docker pull "$IMAGE" && break
            [ "$i" -lt 5 ] || exit 1
            echo "pull $i failed, again in $((i * 10)) s"
            sleep $((i * 10))
          done
          docker run -d --name postgres -p 5433:5432 \
            --tmpfs /var/lib/postgresql:rw,size=8g \
            -e POSTGRES_USER=lawgraph -e POSTGRES_PASSWORD=lawgraph-test \
            "$IMAGE" \
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off \
            -c jit=off -c max_connections=300

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Wait for PostgreSQL
        run: |
          for _ in $(seq 1 60); do
            docker exec postgres pg_isready -U lawgraph -h localhost && exit 0
            sleep 1
          done
          exit 1

      - name: Run ${{ matrix.shard }}
        run: pytest ${{ matrix.tests }} -n auto --dist ${{ matrix.dist || 'worksteal' }} --durations=20

  # The one check of the database tests the merge gate reads: green when every shard is, or
  # when the same files passed on develop.
  database:
    if: always()
    needs: [reuse, database-shard]
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        run: test "${{ needs.database-shard.result }}" = success || test "${{ needs.reuse.outputs.tested }}" = true

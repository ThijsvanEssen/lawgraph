name: tests

# On every pull request, and on a push to develop or main. A newer push to a pull request, or a
# newer push to develop, cancels the run still going there; a run of a push to main (the one a
# deploy waits for) is never cancelled.
on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: tests-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref == 'refs/heads/develop' && 'develop' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/develop' }}

jobs:
  # A commit whose files were already tested green does not run the suites again: the jobs
  # below are green under their own names (test, database) without them
  # (.github/scripts/tested-before.sh compares the trees):
  # - the push of a pull request's merge to develop, when the branch already held develop: the
  #   merge commit has the files of the pull request's head, and its pull_request run counts;
  # - the release pull request (main-X.Y.Z into main) and the push of its merge to main: they
  #   hold the files of a develop commit, and the run of its push to develop counts.
  # Other files, or no green run, and everything runs.
  reuse:
    if: github.event_name == 'push' || startsWith(github.head_ref, 'main-')
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      tested: ${{ steps.check.outputs.tested }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if .github/scripts/tested-before.sh tests.yaml; then
            echo "tested=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: reuse
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    env:
      RUN: ${{ needs.reuse.outputs.tested != 'true' }}

    steps:
      - name: Tested before
        if: env.RUN != 'true'
        run: echo "the same files passed before"

      - uses: actions/checkout@v7
        if: env.RUN == 'true'

      - uses: actions/setup-python@v7
        if: env.RUN == 'true'
        with:
          python-version: '3.14'

      - uses: astral-sh/setup-uv@v10.3.0
        if: env.RUN == 'true'
        with:
          version: 0.13.1
          enable-cache: true
          cache-dependency-glob: uv.lock

      # exactly the versions of uv.lock, into .venv
      - name: Install dependencies
        if: env.RUN == 'true'
        run: |
          uv sync --frozen --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Cache pre-commit environments
        if: env.RUN == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      # the hooks of .pre-commit-config.yaml (mypy, a pre-push hook, is the next step)
      - name: Run pre-commit
        if: env.RUN == 'true'
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Check types
        if: env.RUN == 'true'
        run: mypy

      # The unit suite over the cores of the runner; the database suites are the shards below.
      - name: Run tests
        if: env.RUN == 'true'
        run: pytest -n auto --ignore=tests/pg --ignore=tests/integration

  # The tests that need a database (tests/pg, tests/integration), against a PostgreSQL like
  # postgres-test of docker-compose.test.yml. The suites run in six shards side by side, made of
  # files by the first letter of their name (every letter in one shard) so that the measured
  # durations (--durations) of each add up to about the same, a sixth of the whole. Each is
  # spread test by test over the cores of its runner (worksteal): every test makes a database
  # of its own, so the tests do not meet, and a long file does not keep one core busy while the
  # others wait. A shard with a file that uses xdist_group (its tests on the one worker that
  # built their database) runs loadgroup instead, as worksteal ignores the group;
  # tests/conventions/test_ci_shards.py checks that, and that every file is in one shard.
  database-shard:
    needs: reuse
    if: ${{ !cancelled() && needs.reuse.outputs.tested != 'true' }}
    name: database-shard (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            tests: tests/pg/test_[a-ej-r]*.py
            dist: loadgroup
          - shard: 2
            tests: tests/pg/test_[f-i]*.py tests/integration/test_[k-m]*.py
            dist: loadgroup
          - shard: 3
            tests: tests/pg/test_[s-z]*.py tests/integration/test_[norv-z]*.py
          - shard: 4
            tests: tests/integration/test_[a-ct]*.py
          - shard: 5
            tests: tests/integration/test_[d-i]*.py
          - shard: 6
            tests: tests/integration/test_[jp-qsu]*.py
            dist: loadgroup

    # A PostgreSQL that does not answer fails the shard (ALLOW_DB_TESTS); there is no S3
    # server here, so the tests of the payload store in a bucket are skipped (ALLOW_S3_TESTS).
    env:
      ALLOW_DB_TESTS: '1'
      ALLOW_S3_TESTS: '0'
      LAWGRAPH_TEST_DB_URL: postgresql://lawgraph:lawgraph-test@localhost:5433/lawgraph

    steps:
      - uses: actions/checkout@v7

      # Test data only: the data directory in memory, and no waiting for the disk (fsync,
      # synchronous_commit and full_page_writes off). JIT off, as on postgres-test. The
      # official image (postgres:18 of Docker Hub, the same digest on every registry below),
      # pulled without login. Each registry limits anonymous pulls from the shared runner
      # addresses in its own way (Docker Hub per hour, ECR Public on data volume: "Data limit
      # exceeded"), so the pull goes down the list: Google's Docker Hub mirror, ECR Public,
      # Docker Hub itself; the list is tried 4 times, 10, 20 and 30 s apart. It starts while
      # Python is installed; the step before the tests waits until it answers.
      - name: Start PostgreSQL
        env:
          IMAGES: >-
            mirror.gcr.io/library/postgres:18
            public.ecr.aws/docker/library/postgres:18
            docker.io/library/postgres:18
        run: |
          pull() {
            for round in 1 2 3 4; do
              for image in $IMAGES; do
                docker pull "$image" && { IMAGE=$image; return 0; }
              done
              [ "$round" -lt 4 ] || return 1
              echo "round $round failed, again in $((round * 10)) s"
              sleep $((round * 10))
            done
          }
          pull
          echo "pulled $IMAGE"
          docker run -d --name postgres -p 5433:5432 \
            --tmpfs /var/lib/postgresql:rw,size=8g \
            -e POSTGRES_USER=lawgraph -e POSTGRES_PASSWORD=lawgraph-test \
            "$IMAGE" \
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off \
            -c jit=off -c max_connections=300

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: 0.13.1
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: |
          uv sync --frozen --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Wait for PostgreSQL
        run: |
          for _ in $(seq 1 60); do
            docker exec postgres pg_isready -U lawgraph -h localhost && exit 0
            sleep 1
          done
          exit 1

      - name: Run ${{ matrix.shard }}
        run: pytest ${{ matrix.tests }} -n auto --dist ${{ matrix.dist || 'worksteal' }} --durations=20

  # The one check of the database tests the merge gate reads: green when every shard is, or
  # when the same files passed before.
  database:
    if: always()
    needs: [reuse, database-shard]
    runs-on: ubuntu-24.04
    steps:
      - name: Every shard passed
        run: test "${{ needs.database-shard.result }}" = success || test "${{ needs.reuse.outputs.tested }}" = true

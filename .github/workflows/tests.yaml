name: tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Check types
        run: mypy

      - name: Run tests
        run: pytest

  # The tests that need a database (tests/pg, tests/integration), against a PostgreSQL like
  # postgres-test of docker-compose.test.yml. On a pull request and on develop and main, not on
  # every push to a branch. The suites run in three shards side by side (tests/integration
  # split by file name: a-l, and every other file), each spread over the cores of its
  # runner; every test makes a database of its own, so the tests do not meet.
  database-shard:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    name: database-shard (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: pg
            tests: tests/pg
          - shard: integration-a-l
            tests: tests/integration/test_[a-l]*.py
          - shard: integration-rest
            tests: tests/integration --ignore-glob=tests/integration/test_[a-l]*.py

    env:
      ALLOW_DB_TESTS: '1'
      LAWGRAPH_TEST_DB_URL: postgresql://lawgraph:lawgraph-test@localhost:5433/lawgraph

    steps:
      - uses: actions/checkout@v4

      # Test data only: the data directory in memory, and no waiting for the disk (fsync,
      # synchronous_commit and full_page_writes off). JIT off, as on postgres-test.
      - name: Start PostgreSQL
        run: |
          docker run -d --name postgres -p 5433:5432 \
            --tmpfs /var/lib/postgresql:rw,size=8g \
            -e POSTGRES_USER=lawgraph -e POSTGRES_PASSWORD=lawgraph-test \
            postgres:18 \
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off \
            -c jit=off -c max_connections=300
          for _ in $(seq 1 60); do
            docker exec postgres pg_isready -U lawgraph -h localhost && break
            sleep 1
          done

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run ${{ matrix.shard }}
        run: pytest ${{ matrix.tests }} -n auto --dist loadfile --durations=0 --durations-min=0.05

  # The one check of the database tests the merge gate reads: green when every shard is.
  database:
    if: always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    needs: database-shard
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        run: test "${{ needs.database-shard.result }}" = success

name: tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Check types
        run: mypy

      - name: Run tests
        run: pytest

  # The tests that need a database (tests/pg, tests/integration), against a PostgreSQL like
  # postgres-test of docker-compose.test.yml. On a pull request and on develop and main, not on
  # every push to a branch. The suites run in four shards side by side, each split by file name
  # where the measured durations (--durations) halve it, and each spread test by test over the
  # cores of its runner (worksteal): every test makes a database of its own, so the tests do not
  # meet, and a long file does not keep one core busy while the others wait.
  database-shard:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    name: database-shard (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: pg-a-f
            tests: tests/pg/test_[a-f]*.py
          - shard: pg-rest
            tests: tests/pg --ignore-glob=tests/pg/test_[a-f]*.py
          - shard: integration-a-i
            tests: tests/integration/test_[a-i]*.py
          - shard: integration-rest
            tests: tests/integration --ignore-glob=tests/integration/test_[a-i]*.py

    env:
      ALLOW_DB_TESTS: '1'
      LAWGRAPH_TEST_DB_URL: postgresql://lawgraph:lawgraph-test@localhost:5433/lawgraph

    steps:
      - uses: actions/checkout@v4

      # Test data only: the data directory in memory, and no waiting for the disk (fsync,
      # synchronous_commit and full_page_writes off). JIT off, as on postgres-test. The
      # official image from the ECR Public mirror of Docker Hub (the same digest): a runner
      # pulling from Docker Hub without login hits its rate limit. ECR Public throttles a
      # burst of pulls too (the shards at once: "toomanyrequests"), so the pull is tried 5
      # times, 10, 20, 30 and 40 s apart. It starts while Python is installed; the step before
      # the tests waits until it answers.
      - name: Start PostgreSQL
        env:
          IMAGE: public.ecr.aws/docker/library/postgres:18
        run: |
          for i in 1 2 3 4 5; do
            docker pull "$IMAGE" && break
            [ "$i" -lt 5 ] || exit 1
            echo "pull $i failed, again in $((i * 10)) s"
            sleep $((i * 10))
          done
          docker run -d --name postgres -p 5433:5432 \
            --tmpfs /var/lib/postgresql:rw,size=8g \
            -e POSTGRES_USER=lawgraph -e POSTGRES_PASSWORD=lawgraph-test \
            "$IMAGE" \
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off \
            -c jit=off -c max_connections=300

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Wait for PostgreSQL
        run: |
          for _ in $(seq 1 60); do
            docker exec postgres pg_isready -U lawgraph -h localhost && exit 0
            sleep 1
          done
          exit 1

      - name: Run ${{ matrix.shard }}
        run: pytest ${{ matrix.tests }} -n auto --dist worksteal --durations=20

  # The one check of the database tests the merge gate reads: green when every shard is.
  database:
    if: always() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    needs: database-shard
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        run: test "${{ needs.database-shard.result }}" = success

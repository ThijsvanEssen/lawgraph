name: deploy

# Puts one commit on the server: over SSH a checkout of exactly that commit, the dependencies
# of its uv.lock, and a restart of the API that has to answer /api/health; then it waits for
# the warm-up and runs scripts/smoke.sh against the public address. A failed deploy or smoke
# test puts the previous commit back. The server is laid out as docs/operations.md, "Deploy",
# describes.
#
# Started by a push to `release`, and only once tests.yaml is green on that commit: a release
# moves `release` to the merge commit on main that carries its tag build-X.Y.Z. The smoke test
# expects the version of that commit (`__version__` in src/lawgraph/__init__.py) from /api/health.
#
# Secrets of the repository (Settings → Secrets and variables → Actions):
#   DEPLOY_SSH_KEY  the private key whose public half is in ~/.ssh/authorized_keys on the server
#   DEPLOY_HOST     the address of the server
#   DEPLOY_KNOWN_HOSTS  the known_hosts line of the server's host key, taken on the server itself
#                   (`ssh-keygen -y -f /etc/ssh/ssh_host_ed25519_key`, prefixed with the address);
#                   a deploy talks to no other host, so a changed key stops it
#   DEPLOY_USER     the user that owns DEPLOY_DIR and may run `sudo systemctl restart lawgraph-api`
# Variable (optional): PUBLIC_URL, the address the smoke test uses (default https://concordans.nl).

on:
  push:
    branches: [release]

# one deploy at a time; a second one waits for the first instead of cancelling it halfway
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  DEPLOY_DIR: /srv/lawgraph
  SHA: ${{ github.sha }}
  PUBLIC_URL: ${{ vars.PUBLIC_URL || 'https://concordans.nl' }}
  # how long the API may take to warm up after the restart
  WARM_UP_SECONDS: 1200

jobs:
  # No deploy without green tests: the run of tests.yaml for this commit (the push of the
  # release's merge to main) has to be green; a run still going is waited for.
  tested:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - name: tests.yaml green on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          WAIT_MINUTES: 90
        run: .github/scripts/green-on.sh tests.yaml "$SHA"

  deploy:
    needs: tested
    runs-on: ubuntu-24.04
    # how long the deploy and its rollback wait for a scheduled run that holds the lock (as
    # LAWGRAPH_LOCK_WAIT does for scripts/_run.sh); with the warm-up well inside the job's 6 hours.
    env:
      LAWGRAPH_LOCK_WAIT: 1800
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          sparse-checkout: |
            scripts/smoke.sh
            src/lawgraph/__init__.py
          sparse-checkout-cone-mode: false

      - name: SSH key and host key
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          echo "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      # Under the lock of the scheduled runs (scripts/_run.sh, with TMPDIR=$DEPLOY_DIR/tmp as the
      # timers set it): a deploy never swaps the code under a running load. When a run holds the
      # lock the deploy waits for it, up to LAWGRAPH_LOCK_WAIT seconds, and says so every minute;
      # a lock still held after that fails the deploy before it changes anything.
      # Before the checkout it writes "<previous> <new> <run id>" to deploy/previous: only this
      # run's rollback uses it.
      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" "DEPLOY_DIR=$DEPLOY_DIR SHA=$SHA RUN=$GITHUB_RUN_ID WARM=$WARM_UP_SECONDS LAWGRAPH_LOCK_WAIT=$LAWGRAPH_LOCK_WAIT sh -s" << 'EOF'
          set -e
          LOCK="$DEPLOY_DIR/tmp/lawgraph-scheduled.lock"
          waited=0
          until mkdir "$LOCK" 2>/dev/null; do
            if [ "$waited" -ge "$LAWGRAPH_LOCK_WAIT" ]; then
              echo "[deploy] a scheduled run still holds $LOCK after ${waited} s; run this job again later"
              exit 1
            fi
            [ "$((waited % 60))" -ne 0 ] || echo "[deploy] a scheduled run holds $LOCK; waiting (${waited} s of ${LAWGRAPH_LOCK_WAIT} s)"
            sleep 1
            waited=$((waited + 1))
          done
          [ "$waited" -eq 0 ] || echo "[deploy] took $LOCK after waiting ${waited} s"
          # the watch of the API (deploy/server/bin/api-watch.sh) leaves the API alone meanwhile
          touch "$DEPLOY_DIR/tmp/deploying"
          trap 'rm -f "$DEPLOY_DIR/tmp/deploying"; rmdir "$LOCK"' EXIT
          cd "$DEPLOY_DIR/app"
          # the tags too: a bootstrap records `git describe` of the checkout
          git fetch --quiet --tags origin
          mkdir -p "$DEPLOY_DIR/deploy"
          echo "$(git rev-parse HEAD) $SHA $RUN" > "$DEPLOY_DIR/deploy/previous"
          git checkout --quiet --detach "$SHA"
          # exactly the versions of the commit's uv.lock, into .venv (editable, with the entry
          # points); without the dev extra, and what is not in the lock goes
          "$HOME/.local/bin/uv" sync --quiet --frozen < /dev/null
          # the release applies its schema once at its start (ensure_schema skips a schema whose
          # digest is the one kept, and a release before the digest does not keep its own)
          [ -r "$DEPLOY_DIR/scheduler.env" ] && . "$DEPLOY_DIR/scheduler.env"
          docker exec -i "${LAWGRAPH_DB_CONTAINER:-lawgraph-postgres}" psql -X -q -v ON_ERROR_STOP=1 \
            -U lawgraph -d "${LAWGRAPH_DB_NAME:-lawgraph}" -c "DELETE FROM pipeline_state WHERE key = 'schema'" < /dev/null
          since=$(date '+%Y-%m-%d %H:%M:%S')
          sudo -n systemctl restart lawgraph-api < /dev/null
          for _ in $(seq 30); do
            curl -fsS http://127.0.0.1:8000/api/health > /dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/health
          echo
          echo "[deploy] running $(git log --oneline -1)"
          # Warm when /api/health says so ("warm": true, the warm-up of the current data done;
          # what it does after that, the most cited articles, is not waited for), or has
          # answers of some data version (warm_version) and computes nothing more (computing
          # false): under constant writes "warm" itself can stay false while every request is
          # answered from the last version. "warm": null is warm-up off; an API without
          # these fields is followed by its journal line.
          for _ in $(seq "$((WARM / 5))"); do
            health=$(curl -fsS http://127.0.0.1:8000/api/health 2>/dev/null || true)
            case "$health" in
              *'"warm":null'*) line="warm-up off: $health" ;;
              *'"warm":true'*) line="warm: $health" ;;
              *'"computing":false'*)
                case "$health" in
                  *'"warm_version":null'*) line="" ;;
                  *) line="warm: $health" ;;
                esac ;;
              *'"computing":'*) line="" ;;
              *'"warm":'*) line="" ;;
              *) line=$(journalctl -u lawgraph-api --since "$since" -o cat 2>/dev/null \
                   | grep -m1 -E 'Warm-up done|No warm-up at the start' || true) ;;
            esac
            [ -n "$line" ] && break
            sleep 5
          done
          echo "[deploy] ${line:-not warm within $WARM s; the smoke test decides}"
          EOF
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}

      - name: Smoke test
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/lawgraph/__init__.py)
          [ -n "$version" ] || { echo "[smoke] FAIL no __version__ in src/lawgraph/__init__.py"; exit 1; }
          scripts/smoke.sh "$PUBLIC_URL" "$version"

      # Only when this run changed the code (deploy/previous names this run and the server is on
      # its commit): under the lock (waited for as the deploy does) back to the previous commit,
      # its dependencies, a restart and /api/health, then an alert through LAWGRAPH_ALERT_COMMAND
      # of scheduler.env (or bin/alert.sh), in the form of docs/operations.md, "Alerts" (`Deploy <versie>`). The job
      # stays red either way.
      - name: Roll back
        if: failure()
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/lawgraph/__init__.py)
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" "DEPLOY_DIR=$DEPLOY_DIR SHA=$SHA VERSION=${version:-$SHA} RUN=$GITHUB_RUN_ID LAWGRAPH_LOCK_WAIT=$LAWGRAPH_LOCK_WAIT sh -s" << 'EOF'
          set -e
          [ -r "$DEPLOY_DIR/scheduler.env" ] && . "$DEPLOY_DIR/scheduler.env"
          alert() {
            if [ -n "$LAWGRAPH_ALERT_COMMAND" ]; then
              LAWGRAPH_ALERT_MESSAGE="$1" sh -c "$LAWGRAPH_ALERT_COMMAND" || true
            elif [ -x "$DEPLOY_DIR/bin/alert.sh" ]; then
              "$DEPLOY_DIR/bin/alert.sh" "$1" || true
            fi
          }
          read -r prev new run < "$DEPLOY_DIR/deploy/previous" || true
          cd "$DEPLOY_DIR/app"
          if [ "$run" != "$RUN" ] || [ "$(git rev-parse HEAD)" != "$SHA" ]; then
            echo "[rollback] this run changed nothing on the server; nothing to roll back"
            alert "Deploy $VERSION: mislukt, server-ongewijzigd [actie]"
            exit 0
          fi
          LOCK="$DEPLOY_DIR/tmp/lawgraph-scheduled.lock"
          waited=0
          until mkdir "$LOCK" 2>/dev/null; do
            if [ "$waited" -ge "$LAWGRAPH_LOCK_WAIT" ]; then
              echo "[rollback] a scheduled run still holds $LOCK after ${waited} s"
              alert "Deploy $VERSION: mislukt, lock-bezet [actie]"
              exit 1
            fi
            [ "$((waited % 60))" -ne 0 ] || echo "[rollback] a scheduled run holds $LOCK; waiting (${waited} s of ${LAWGRAPH_LOCK_WAIT} s)"
            sleep 1
            waited=$((waited + 1))
          done
          [ "$waited" -eq 0 ] || echo "[rollback] took $LOCK after waiting ${waited} s"
          # the watch of the API (deploy/server/bin/api-watch.sh) leaves the API alone meanwhile
          touch "$DEPLOY_DIR/tmp/deploying"
          trap 'rm -f "$DEPLOY_DIR/tmp/deploying"; rmdir "$LOCK"' EXIT
          git checkout --quiet --detach "$prev"
          # the lock of the previous commit; a commit from before uv.lock installs its ranges
          if [ -f uv.lock ]; then
            "$HOME/.local/bin/uv" sync --quiet --frozen < /dev/null
          else
            "$HOME/.local/bin/uv" pip install --quiet --python .venv/bin/python -e . < /dev/null
          fi
          # the previous release applies its schema once at its start, as at a deploy
          docker exec -i "${LAWGRAPH_DB_CONTAINER:-lawgraph-postgres}" psql -X -q -v ON_ERROR_STOP=1 \
            -U lawgraph -d "${LAWGRAPH_DB_NAME:-lawgraph}" -c "DELETE FROM pipeline_state WHERE key = 'schema'" < /dev/null \
            || echo "[rollback] could not drop the digest of the schema; the start keeps it"
          sudo -n systemctl restart lawgraph-api < /dev/null
          for _ in $(seq 30); do
            curl -fsS http://127.0.0.1:8000/api/health > /dev/null 2>&1 && break
            sleep 1
          done
          if curl -fsS http://127.0.0.1:8000/api/health > /dev/null; then
            echo "[rollback] back on $(git log --oneline -1)"
            alert "Deploy $VERSION: mislukt, teruggezet [actie]"
          else
            alert "Deploy $VERSION: mislukt, terugzetten-faalt [actie]"
            exit 1
          fi
          EOF
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}

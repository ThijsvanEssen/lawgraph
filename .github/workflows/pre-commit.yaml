name: pre-commit

# As tests.yaml: on every pull request and on a push to develop or main; a newer push to a pull
# request cancels its run still going.
on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: pre-commit-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          version: 0.13.1
          enable-cache: true
          cache-dependency-glob: uv.lock

      # the dev extra of uv.lock: pre-commit and the ruff the hook pins
      - name: Install dependencies
        run: |
          uv sync --frozen --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Run pre-commit on all files
        run: |
          pre-commit run --all-files

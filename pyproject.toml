[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lawgraph"
version = "0.3.0"
description = "Pipelines voor NL/EU wetgeving en rechtspraak naar een ArangoDB knowledge graph."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

authors = [
  { name = "Thijs van Essen", email = "thijs@tmve.nl" }
]

dependencies = [
  "requests>=2.31.0",
  "python-arango>=7.6.0",
  "python-dotenv>=1.0.0",
  "pydantic>=2.0,<3",
  "fastapi>=0.110.0,<1",
  "uvicorn[standard]>=0.32,<0.33",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
  "mypy>=2.1",
  "httpx>=0.28.1",
  "pre-commit>=3.0",
]

[project.urls]
Source = "https://github.com/ThijsvanEssen/lawgraph"

[project.scripts]
lawgraph     = "lawgraph.__main__:main"
lawgraph-api = "lawgraph.api.app:_run_server"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C", "I", "TID251"]

[tool.ruff.lint.mccabe]
max-complexity = 15

# The formatter wraps at 88; text it cannot wrap (strings, AQL) may run to 100.
[tool.ruff.lint.pycodestyle]
max-line-length = 100

# A command returns its result and `run_command` decides how it ended: only the entry points
# end the process or set up logging, so any command can be a part of another.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sys.exit".msg = "Return a PipelineResult; only __main__ turns an outcome into an exit code."
"lawgraph.core.logging.setup_logging".msg = "Only an entry point (__main__, api/app.py) sets up logging."

[tool.ruff.lint.per-file-ignores]
"src/lawgraph/api/queries/*.py" = ["E501"]
"src/lawgraph/__main__.py" = ["TID251"]
"src/lawgraph/api/app.py" = ["TID251"]
"tests/*" = ["TID251"]

[tool.mypy]
python_version = "3.11"
files = ["src"]

[[tool.mypy.overrides]]
module = ["requests.*"]  # no stubs installed; the clients annotate what they use of it
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

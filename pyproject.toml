[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lawgraph"
dynamic = ["version"]
description = "Pipelines voor NL/EU wetgeving en rechtspraak naar een PostgreSQL-graaf."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }

authors = [
  { name = "Thijs van Essen", email = "thijs@tmve.nl" }
]

dependencies = [
  "requests>=2.31.0",
  "psycopg[binary,pool]>=3.2",
  "python-dotenv>=1.0.0",
  "pydantic>=2.0,<3",
  "fastapi>=0.110.0,<1",
  "uvicorn[standard]>=0.32,<0.33",
  "boto3>=1.35",  # the payload store in an S3 bucket (db/payloads.py)
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-xdist>=3.6",  # CI runs the database tests side by side (-n auto)
  "ruff==0.15.13",  # the rev of the ruff hook in .pre-commit-config.yaml
  "mypy>=2.1",
  "httpx>=0.28.1",
  "pre-commit>=3.0",
  "pyyaml>=6",  # tests/conventions/test_ci_shards.py reads the shards of tests.yaml
  "uv==0.13.1",  # the uv that writes uv.lock; the version setup-uv pins in the workflows
]

[project.urls]
Source = "https://github.com/ThijsvanEssen/lawgraph"

[project.scripts]
lawgraph     = "lawgraph.__main__:main"
lawgraph-api = "lawgraph.api.app:_run_server"

[tool.setuptools]
package-dir = {"" = "src"}

# the one version, set by a release: lawgraph/__init__.py
[tool.setuptools.dynamic]
version = {attr = "lawgraph.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "BLE", "C", "I", "UP", "TID251"]
# UP031: a regex with braces reads better with %; UP042: StrEnum changes what str() gives
ignore = ["UP031", "UP042"]

[tool.ruff.lint.mccabe]
max-complexity = 15

# The formatter wraps at 88; text it cannot wrap (strings, SQL) may run to 100.
[tool.ruff.lint.pycodestyle]
max-line-length = 100

# A command returns its result and `run_command` decides how it ended: only the entry points
# end the process or set up logging, so any command can be a part of another.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"sys.exit".msg = "Return a PipelineResult; only __main__ turns an outcome into an exit code."
"lawgraph.core.logging.setup_logging".msg = "Only an entry point (__main__, api/app.py) sets up logging."

[tool.ruff.lint.per-file-ignores]
"src/lawgraph/db/queries/*.py" = ["E501"]
"src/lawgraph/__main__.py" = ["TID251"]
"src/lawgraph/api/app.py" = ["TID251"]
"tests/*" = ["TID251"]

[tool.mypy]
python_version = "3.14"
files = ["src", "tests"]
strict = true
plugins = ["pydantic.mypy"]  # the defaults of Field(None, ...): a DTO built in a test

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*", "yaml"]  # no stubs installed; the code annotates what it uses
ignore_missing_imports = true

# The tests: every call and value checked, but a test or helper need not annotate itself,
# and a test may put a stand-in for a method on the one object it tests.
[[tool.mypy.overrides]]
module = ["tests.*"]
disable_error_code = ["method-assign"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_any_generics = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
lawgraph = ["data/*.json", "data/curated/*.json"]

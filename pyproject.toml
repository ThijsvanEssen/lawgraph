[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lawgraph"
version = "0.3.0"
description = "Pipelines voor NL/EU wetgeving en rechtspraak naar een ArangoDB knowledge graph."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

authors = [
  { name = "Thijs van Essen", email = "thijs@tmve.nl" }
]

dependencies = [
  "pyyaml>=6.0.0",
  "requests>=2.31.0",
  "python-arango>=7.6.0",
  "python-dotenv>=1.0.0",
  "typing-extensions>=4.12.0",
  "fastapi>=0.110.0,<1",
  "uvicorn[standard]>=0.32,<0.33",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
  "httpx>=0.28.1",
]

[project.urls]
Homepage = "https://example.com/lawgraph"
Source = "https://example.com/lawgraph.git"

[project.scripts]
lawgraph     = "lawgraph.__main__:main"
lawgraph-api = "lawgraph.api.app:_run_server"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C", "I"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]
"src/lawgraph/api/queries/__init__.py" = ["F401"]  # re-export module
"src/lawgraph/api/queries/*.py" = ["E501"]

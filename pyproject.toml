[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lawgraph"
version = "0.3.0"
description = "Pipelines voor NL/EU wetgeving en rechtspraak naar een ArangoDB knowledge graph."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

authors = [
  { name = "Thijs van Essen", email = "hi@thijsvanessen.nl" }
]

dependencies = [
  "pyyaml>=6.0.0",
  "requests>=2.31.0",
  "python-arango>=7.6.0",
  "python-dotenv>=1.0.0",
  "typing-extensions>=4.12.0",
  "fastapi>=0.110.0,<1",
  "uvicorn[standard]>=0.32,<0.33",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
  "httpx>=0.28.1",
]

[project.urls]
Homepage = "https://example.com/lawgraph"
Source = "https://example.com/lawgraph.git"

[project.scripts]
lawgraph-retrieve-tk = "lawgraph.cli.retrieve_tk:main"
lawgraph-retrieve-rechtspraak = "lawgraph.cli.retrieve_rechtspraak:main"
lawgraph-retrieve-eurlex = "lawgraph.cli.retrieve_eurlex:main"
lawgraph-retrieve-bwb = "lawgraph.cli.retrieve_bwb:main"
lawgraph-retrieve-bwb-history = "lawgraph.cli.retrieve_bwb_history:main"
lawgraph-retrieve-all = "lawgraph.cli.retrieve_all:main"
lawgraph-normalize-tk = "lawgraph.cli.normalize_tk:main"
lawgraph-normalize-rechtspraak = "lawgraph.cli.normalize_rechtspraak:main"
lawgraph-normalize-eurlex = "lawgraph.cli.normalize_eurlex:main"
lawgraph-normalize-bwb = "lawgraph.cli.normalize_bwb:main"
lawgraph-normalize-bwb-history = "lawgraph.cli.normalize_bwb_history:main"
lawgraph-normalize-all = "lawgraph.cli.normalize_all:main"
lawgraph-strafrecht-seed = "lawgraph.cli.strafrecht_seed:main"
lawgraph-semantic-rechtspraak-articles = "lawgraph.cli.semantic_rechtspraak_articles:main"
lawgraph-semantic-tk-articles = "lawgraph.cli.semantic_tk_articles:main"
lawgraph-semantic-eu-articles = "lawgraph.cli.semantic_eu_articles:main"
lawgraph-semantic-bwb-articles = "lawgraph.cli.semantic_bwb_articles:main"
lawgraph-semantic-amendment-articles = "lawgraph.cli.semantic_amendment_articles:main"
lawgraph-api = "lawgraph.api.app:app"
# Parliamentary dossier pipelines
lawgraph-retrieve-tk-dossiers  = "lawgraph.cli.retrieve_tk_dossiers:main"
lawgraph-normalize-tk-dossiers = "lawgraph.cli.normalize_tk_dossiers:main"
lawgraph-backfill-edge-status  = "lawgraph.cli.backfill_edge_status:main"
lawgraph-backfill-fractie-memberships = "lawgraph.cli.backfill_fractie_memberships:main"
lawgraph-backfill-auteur-van          = "lawgraph.cli.backfill_auteur_van:main"
lawgraph-backfill-list-stats = "lawgraph.cli.backfill_list_stats:main"
lawgraph-semantic-all                    = "lawgraph.cli.semantic_all:main"
lawgraph-semantic-judgment-citations     = "lawgraph.cli.semantic_judgment_citations:main"
lawgraph-semantic-instrument-relations   = "lawgraph.cli.semantic_instrument_relations:main"
lawgraph-retrieve-tk-content             = "lawgraph.cli.retrieve_tk_content:main"
lawgraph-fill-gaps                       = "lawgraph.cli.fill_gaps:main"
lawgraph-migrate-dedup-instruments       = "lawgraph.cli.migrate_dedup_instruments:main"
lawgraph-retrieve-staatsblad             = "lawgraph.cli.retrieve_staatsblad:main"
lawgraph-normalize-staatsblad            = "lawgraph.cli.normalize_staatsblad:main"
lawgraph-semantic-staatsblad-nvt         = "lawgraph.cli.semantic_staatsblad_nvt:main"
lawgraph-semantic-mvt-articles           = "lawgraph.cli.semantic_mvt_articles:main"
lawgraph-semantic-bwb-grondslagen        = "lawgraph.cli.semantic_bwb_grondslagen:main"
lawgraph-semantic-dossier-law-link       = "lawgraph.cli.semantic_dossier_law_link:main"
lawgraph-semantic-version-causes         = "lawgraph.cli.semantic_version_causes:main"
lawgraph-retrieve-eerstekamer            = "lawgraph.cli.retrieve_eerstekamer:main"
lawgraph-normalize-eerstekamer           = "lawgraph.cli.normalize_eerstekamer:main"
lawgraph-semantic-ek-dossier-link        = "lawgraph.cli.semantic_eerstekamer_dossier_link:main"
lawgraph-retrieve-staatscourant          = "lawgraph.cli.retrieve_staatscourant:main"
lawgraph-normalize-staatscourant         = "lawgraph.cli.normalize_staatscourant:main"
lawgraph-semantic-staatscourant-regeling = "lawgraph.cli.semantic_staatscourant_regeling:main"
lawgraph-retrieve-echr                   = "lawgraph.cli.retrieve_echr:main"
lawgraph-normalize-echr                  = "lawgraph.cli.normalize_echr:main"
lawgraph-semantic-echr-citations         = "lawgraph.cli.semantic_echr_citations:main"
lawgraph-retrieve-verdragenbank          = "lawgraph.cli.retrieve_verdragenbank:main"
lawgraph-normalize-verdragenbank         = "lawgraph.cli.normalize_verdragenbank:main"
lawgraph-expand-graph                    = "lawgraph.cli.expand_graph:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C", "I"]

[tool.ruff.lint.mccabe]
max-complexity = 28

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E501"]
"src/lawgraph/api/queries.py" = ["E501"]
"src/lawgraph/api/queries/*.py" = ["E501"]

services:
  arangodb:
    image: arangodb:3.12
    container_name: arango-lawgraph
    restart: unless-stopped
    ports:
      - "8529:8529"
    environment:
      - ARANGO_ROOT_PASSWORD=${ARANGO_ROOT_PASSWORD}
    # ArangoDB sizes its caches from the memory it sees (the whole Docker VM) and has no limit
    # of its own: on an 8 GB VM it grew until the kernel killed it (exit 137, OOMKilled) in
    # the middle of a load. The caches are bounded here so that it stays well under mem_limit.
    mem_limit: 5g
    command:
      - arangod
      - --rocksdb.block-cache-size=1073741824           # 1 GiB
      - --rocksdb.enforce-block-cache-size-limit=true
      - --rocksdb.total-write-buffer-size=536870912     # 512 MiB
      - --cache.size=268435456                          # 256 MiB
      - --query.memory-limit=1073741824                 # 1 GiB per query
      - --query.global-memory-limit=2147483648          # 2 GiB for all queries together
    volumes:
      - arango_data:/var/lib/arangodb3
      - arango_apps:/var/lib/arangodb3-apps

  # The database of the integration tests (tests/integration): its own container, port and
  # throw-away volume, never the data above. It is deliberately small: a query that builds a
  # whole result in the memory of the server, or a run whose memory grows with the number of
  # records, fails here on a few hundred MB of test data instead of on the real corpus.
  #   docker compose --profile test up -d arangodb-test
  #   docker compose --profile test down -v
  arangodb-test:
    profiles: ["test"]
    image: arangodb:3.12
    container_name: arango-lawgraph-test
    ports:
      - "8530:8529"
    environment:
      - ARANGO_ROOT_PASSWORD=${ARANGO_ROOT_PASSWORD}
    mem_limit: 1g
    command:
      - arangod
      - --rocksdb.block-cache-size=134217728            # 128 MiB
      - --rocksdb.enforce-block-cache-size-limit=true
      - --rocksdb.total-write-buffer-size=134217728     # 128 MiB
      - --cache.size=67108864                           # 64 MiB
      - --query.memory-limit=268435456                  # 256 MiB per query
      - --query.global-memory-limit=402653184           # 384 MiB for all queries together
volumes:
  arango_data:
  arango_apps:

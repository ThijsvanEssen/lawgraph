# The database of the integration tests (tests/integration): a project of its own
# (`name:` below), so nothing done to it can reach the real database or its volumes. It is
# deliberately small: a query that builds a whole result in the memory of the server, or a
# run whose memory grows with the number of records, fails here on a few hundred MB of test
# data instead of on the real corpus. Its data is thrown away with the container.
#   docker compose -f docker-compose.test.yml up -d
#   docker compose -f docker-compose.test.yml down
name: lawgraph-test
services:
  # The PostgreSQL of tests/pg and tests/integration: databases lawgraph_it_... come and go here.
  postgres-test:
    image: postgres:18
    container_name: lawgraph-postgres-test
    # As the server of the database shards in CI (.github/workflows/tests.yaml). Test data
    # only: no waiting for the disk (fsync, synchronous_commit and full_page_writes off), so a
    # crash of the server can lose its databases, which no test keeps. No JIT compilation: for
    # these statements it costs more than it gains (the store turns it off on its connections
    # too).
    command:
      - postgres
      - -c
      - jit=off
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=lawgraph
      - POSTGRES_PASSWORD=lawgraph-test
    mem_limit: 1g

  # An S3 server for the payload store in an S3 bucket (tests/integration/test_payloads.py):
  # what LeafCloud's object storage is to the real deployment. Its objects live in the
  # container and go with it.
  s3-test:
    image: versity/versitygw:latest
    container_name: lawgraph-s3-test
    ports:
      - "8531:7070"
    environment:
      - ROOT_ACCESS_KEY=lawgraph
      - ROOT_SECRET_KEY=lawgraph-test-secret
    entrypoint: ["sh", "-c", "mkdir -p /tmp/s3 && exec versitygw --quiet posix /tmp/s3"]
    mem_limit: 256m

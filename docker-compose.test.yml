# The database of the integration tests (tests/integration): a project of its own
# (`name:` below), so nothing done to it can reach the real database or its volumes. It is
# deliberately small: a query that builds a whole result in the memory of the server, or a
# run whose memory grows with the number of records, fails here on a few hundred MB of test
# data instead of on the real corpus. Its data is thrown away with the container.
#   docker compose -f docker-compose.test.yml up -d
#   docker compose -f docker-compose.test.yml down
name: lawgraph-test
services:
  arangodb-test:
    image: arangodb:3.12
    container_name: arango-lawgraph-test
    ports:
      - "8530:8529"
    environment:
      - ARANGO_ROOT_PASSWORD=${ARANGO_ROOT_PASSWORD}
    mem_limit: 1g
    volumes:
      # scripts/restore-test.sh restores the newest dump of scripts/backup.sh here
      - ${LAWGRAPH_BACKUP_DIR:-./backups}:/backups:ro
    command:
      - arangod
      - --rocksdb.block-cache-size=134217728            # 128 MiB
      - --rocksdb.enforce-block-cache-size-limit=true
      - --rocksdb.total-write-buffer-size=134217728     # 128 MiB
      - --cache.size=67108864                           # 64 MiB
      - --query.memory-limit=268435456                  # 256 MiB per query
      - --query.global-memory-limit=402653184           # 384 MiB for all queries together
